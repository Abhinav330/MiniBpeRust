[package]
name = "minibperust"
version = "0.1.0"
edition = "2024"
description = "Rust training and encoding backend for MiniBpeRust"
license = "MIT"
repository = "https://github.com/Abhinav330/MiniBpeRust"
readme = "README.md"
keywords = ["bpe", "tokenizer", "tokenization", "nlp", "llm"]
categories = ["text-processing", "science"]

[lib]
name = "minibperust"
crate-type = ["cdylib"]

[dependencies]
fancy-regex = "0.19.2"
pyo3 = { version = "0.29.0", features = ["abi3-py39"] }
rayon = "1.12.0"
rustc-hash = "2.1.3"
